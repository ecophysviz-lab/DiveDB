repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v3.4.0
      hooks:
        - id: check-yaml
    - repo: https://github.com/psf/black
      rev: 23.1.0
      hooks:
        - id: black
          exclude: jupyter/.*\.py,pyologger/.*\.py
    # Warns (does not block) when a notebook is staged with cell outputs.
    # Committed outputs bloat diffs and can leak data paths, tokens, or record counts.
    # To strip: jupyter nbconvert --clear-output --inplace <notebook>
    - repo: local
      hooks:
        - id: warn-notebook-outputs
          name: warn about notebook outputs
          entry: scripts/warn_notebook_outputs.py
          language: python
          files: \.ipynb$
          verbose: true